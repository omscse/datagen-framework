<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" style="font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b5ef4"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f9c6a"/>
    </marker>
    <marker id="arr-up" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000014"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="530" rx="14" fill="#f4f6f9"/>
  <rect x="1" y="1" width="818" height="528" rx="13" fill="none" stroke="#e2e6ec" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" fill="#1a1a2e" font-size="15" font-weight="700" letter-spacing="0.2">datagen-framework — Architecture</text>
  <line x1="60" y1="44" x2="760" y2="44" stroke="#e2e6ec" stroke-width="1"/>

  <!-- ── Layer label: PACKS ── -->
  <text x="32" y="66" fill="#8892a4" font-family="monospace" font-size="9" letter-spacing="1">YOUR DATA PACKS</text>

  <!-- Pack boxes -->
  <rect x="32"  y="72" width="136" height="52" rx="8" fill="#fff" stroke="#c7d0e0" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="100" y="91"  text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="9">@Pack</text>
  <text x="100" y="108" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="600">UserPack</text>

  <rect x="181" y="72" width="136" height="52" rx="8" fill="#fff" stroke="#c7d0e0" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="249" y="91"  text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="9">@Pack</text>
  <text x="249" y="108" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="600">AccountPack</text>

  <rect x="330" y="72" width="136" height="52" rx="8" fill="#fff" stroke="#c7d0e0" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="398" y="91"  text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="9">@Pack</text>
  <text x="398" y="108" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="600">OrderPack</text>

  <rect x="479" y="72" width="136" height="52" rx="8" fill="#fff" stroke="#c7d0e0" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="547" y="91"  text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="9">@Pack</text>
  <text x="547" y="108" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="600">ProductPack</text>

  <rect x="628" y="72" width="160" height="52" rx="8" fill="#f8fafc" stroke="#c7d0e0" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="708" y="102" text-anchor="middle" fill="#8892a4" font-size="12">+ more packs…</text>

  <!-- Connectors: packs → registry -->
  <polyline points="100,124 100,150 410,150 410,166" fill="none" stroke="#5b5ef4" stroke-width="1" stroke-opacity="0.45" marker-end="url(#arr)"/>
  <polyline points="249,124 249,150" fill="none" stroke="#5b5ef4" stroke-width="1" stroke-opacity="0.45"/>
  <polyline points="398,124 398,150" fill="none" stroke="#5b5ef4" stroke-width="1" stroke-opacity="0.45"/>
  <polyline points="547,124 547,150" fill="none" stroke="#5b5ef4" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="100" y1="150" x2="547" y2="150" stroke="#5b5ef4" stroke-width="1" stroke-opacity="0.45"/>

  <!-- ── Layer: Registry ── -->
  <text x="32" y="163" fill="#8892a4" font-family="monospace" font-size="9" letter-spacing="1">REGISTRY</text>
  <rect x="32" y="168" width="756" height="56" rx="10" fill="#eeeeff" stroke="#5b5ef4" stroke-width="1.5" filter="url(#glow-indigo)"/>
  <text x="410" y="190" text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="10">definePackRegistry()</text>
  <text x="410" y="211" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="600">Pack Registry   { user, account, order, product, session, … }</text>

  <!-- Connectors: registry → core -->
  <polyline points="215,224 215,248" fill="none" stroke="#5b5ef4" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="600,224 600,248" fill="none" stroke="#5b5ef4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer: Core Engine ── -->
  <text x="32" y="246" fill="#8892a4" font-family="monospace" font-size="9" letter-spacing="1">CORE ENGINE</text>

  <!-- DataGenerator — taller to fit full method list -->
  <rect x="32" y="250" width="354" height="76" rx="10" fill="#fff" stroke="#5b5ef4" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="209" y="270" text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="8.5">generateDefault()  ·  generateCustom()  ·  retrieveData()</text>
  <text x="209" y="285" text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="8.5">hasStoredData()  ·  getStoredRecord()  ·  cleanup()</text>
  <text x="209" y="310" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="700">DataGenerator</text>

  <!-- CleanupManager — subtitle updated to bulk-only -->
  <rect x="434" y="250" width="354" height="76" rx="10" fill="#fff" stroke="#5b5ef4" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="611" y="270" text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="8.5">cleanupAll()  —  iterates all store records</text>
  <text x="611" y="285" text-anchor="middle" fill="#5b5ef4" font-family="monospace" font-size="8.5">calls pack.delete(data) per record  (bulk)</text>
  <text x="611" y="310" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="700">CleanupManager</text>

  <!-- Connectors: core → store -->
  <polyline points="209,326 209,352" fill="none" stroke="#0f9c6a" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arr-green)"/>
  <polyline points="611,326 611,352" fill="none" stroke="#0f9c6a" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arr-green)"/>

  <!-- ── Layer: Data Store ── -->
  <text x="32" y="350" fill="#8892a4" font-family="monospace" font-size="9" letter-spacing="1">DATA STORE</text>
  <rect x="32" y="354" width="756" height="56" rx="10" fill="#e8f8f2" stroke="#0f9c6a" stroke-width="1.5" filter="url(#glow-green)"/>
  <line x1="410" y1="362" x2="410" y2="402" stroke="#b2dece" stroke-width="1"/>

  <text x="210" y="378" text-anchor="middle" fill="#0f7a54" font-family="monospace" font-size="10">JsonFileDataStore</text>
  <text x="210" y="396" text-anchor="middle" fill="#1a5c42" font-size="11">.datagen/store.json  (CLI · Web UI)</text>

  <text x="612" y="378" text-anchor="middle" fill="#0f7a54" font-family="monospace" font-size="10">InMemoryDataStore</text>
  <text x="612" y="396" text-anchor="middle" fill="#1a5c42" font-size="11">in-process  (Cypress)</text>

  <!-- Connectors: store → adapters -->
  <polyline points="170,410 170,440" fill="none" stroke="#3b82f6" stroke-width="1.3" stroke-opacity="0.6" marker-end="url(#arr-up)"/>
  <polyline points="410,410 410,440" fill="none" stroke="#3b82f6" stroke-width="1.3" stroke-opacity="0.6" marker-end="url(#arr-up)"/>
  <polyline points="648,410 648,440" fill="none" stroke="#3b82f6" stroke-width="1.3" stroke-opacity="0.6" marker-end="url(#arr-up)"/>

  <!-- ── Layer: Adapters ── -->
  <text x="32" y="438" fill="#8892a4" font-family="monospace" font-size="9" letter-spacing="1">RUNNER ADAPTERS</text>

  <rect x="32"  y="442" width="250" height="62" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="157" y="464" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="9">startWebUiServer(registry, options)</text>
  <text x="157" y="490" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="700">🌐  Web UI</text>

  <rect x="285" y="442" width="250" height="62" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="410" y="464" text-anchor="middle" fill="#b45309" font-family="monospace" font-size="9">runCli(argv, registry, cacheFile)</text>
  <text x="410" y="490" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="700">⌨  CLI</text>

  <rect x="538" y="442" width="250" height="62" rx="10" fill="#fff" stroke="#0f9c6a" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="663" y="464" text-anchor="middle" fill="#0f7a54" font-family="monospace" font-size="9">initCypressAdapter({ registry, on })</text>
  <text x="663" y="490" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="700">🌲  Cypress</text>
</svg>
